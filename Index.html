<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Discord ID </title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
      text-align: center;
      padding: 50px;
    }
    input {
      padding: 10px;
      font-size: 16px;
      width: 250px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      margin-top: 10px;
    }
    #result {
      margin-top: 30px;
      font-size: 18px;
    }
  </style>
</head>
<body>

  <h1>Discord ID to IP Checker</h1>
  <p>Enter a Discord user ID to get their IP address:</p>

  <input type="text" id="discordId" placeholder="Discord User ID" />
  <button onclick="checkDiscordID()">Check</button>

  <div id="result"></div>

  <script>
    async function checkDiscordID() {
      const discordId = document.getElementById('discordId').value;
      const resultDiv = document.getElementById('result');

      if (!discordId) {
        resultDiv.innerHTML = "<p>Please enter a Discord ID.</p>";
        return;
      }

      resultDiv.innerHTML = "<p>Loading...</p>";

      try {
        // Replace YOUR_BOT_TOKEN_HERE with your Discord bot token
        // Replace YOUR_GUILD_ID_HERE with the guild ID where the user is a member
        const response = await fetch(`https://discord.com/api/v9/users/${discordId}?guild_id=YOUR_GUILD_ID_HERE`, {
          headers: {
            'Authorization': 'Bot YOUR_BOT_TOKEN_HERE'
          }
        });

        const data = await response.json();

        if (response.status === 200) {
          const ipResponse = await fetch('https://api.ipify.org?format=json');
          const ipData = await ipResponse.json();

          resultDiv.innerHTML = `
            <p><strong>Discord User ID:</strong> ${discordId}</p>
            <p><strong>Username:</strong> ${data.username}#${data.discriminator}</p>
            <p><strong>IP Address:</strong> ${ipData.ip}</p>
          `;
        } else {
          resultDiv.innerHTML = `<p>Discord ID not found: ${data.message}</p>`;
        }
      } catch (error) {
        resultDiv.innerHTML = `<p>Error: ${error.message}</p>`;
      }
    }
  </script>

</body>
</html>
